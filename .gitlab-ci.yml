# Stube standard CI/CD pipeline for download-gateway.
# Disabled by default — set CI_ENABLED=true as a CI/CD variable to activate.
# See https://kb.nalet.cloud/stube/adr/019-download-plane-consolidation
#
# Required CI/CD variables (group-level ones are shared with chino-api):
#   CI_REGISTRY*, OC_SERVER, OC_TOKEN, REGISTRY_PULL_*  — group-level (exist)
#   ODOWNLOADER_TOKEN                                   — masked; the oDownloader
#       daemon's static bearer token (== secret odownloader-api key "token").
#       The deploy job mints `odownloader-api` in stube from it; both the
#       gateway and the migrated oDownloader daemon consume it.
#   WIREGUARD_CONF                                      — masked/file; the full
#       wg0.conf (incl. the cluster-CIDR PostUp split-tunnel rules — see
#       k8s/clients/secrets.example.yaml). The deploy job mints the
#       `wireguard-config` secret the oDownloader + qBittorrent VPN sidecars
#       mount. NZBGet egresses directly and does not use it.
#
# The deploy job also provisions the migrated download clients (oDownloader,
# qBittorrent, NZBGet) into stube — the download plane is one deployable unit
# (ADR-019). The oDownloader daemon image itself is built by the
# infrastructure/oDownloader pipeline; here we only (re)deploy it.
workflow:
  rules:
    - if: $CI_ENABLED == "true"
      when: always
    - when: never

stages:
  - test
  - containerize
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  OC_NAMESPACE: stube

test:
  stage: test
  image: registry.nalet.cloud/infrastructure/library/golang:1.24-alpine
  script:
    - apk add --no-cache git
    - go vet ./...
    - go build ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

containerize:
  stage: containerize
  image:
    name: registry.nalet.cloud/infrastructure/library/kaniko-project/executor:debug
    entrypoint: [""]
  needs: ["test"]
  script:
    - mkdir -p "$DOCKER_CONFIG"
    - REGISTRY_AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - |
      cat > "$DOCKER_CONFIG/config.json" <<EOF
      {"auths":{"$CI_REGISTRY":{"auth":"$REGISTRY_AUTH"}}}
      EOF
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --destination "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      --destination "$IMAGE_NAME:latest"
      --push-retry=5
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'

deploy:
  stage: deploy
  image: registry.nalet.cloud/infrastructure/library/openshift/origin-cli:4.18
  needs: ["containerize"]
  script:
    - oc login "$OC_SERVER" --token="$OC_TOKEN" --insecure-skip-tls-verify=true
    - |
      oc -n "$OC_NAMESPACE" create secret docker-registry gitlab-registry \
        --docker-server="$CI_REGISTRY" \
        --docker-username="${REGISTRY_PULL_USER:-$CI_REGISTRY_USER}" \
        --docker-password="${REGISTRY_PULL_PASSWORD:-$CI_REGISTRY_PASSWORD}" \
        --dry-run=client -o yaml | oc -n "$OC_NAMESPACE" apply -f -
    # Kafka mTLS client cert. Strimzi materialises the stube-download-gateway
    # KafkaUser as a secret in platform-event-streaming; copy it into stube so
    # the gateway pod can mount it (keys: user.crt / user.key / ca.crt).
    - |
      oc -n platform-event-streaming get secret stube-download-gateway -o yaml \
        | sed 's/namespace: platform-event-streaming/namespace: stube/' \
        | oc -n "$OC_NAMESPACE" apply -f -
    # oDownloader daemon bearer token — consumed by both the gateway adapter
    # and the migrated oDownloader daemon (odownloader-api secret).
    - |
      oc -n "$OC_NAMESPACE" create secret generic odownloader-api \
        --from-literal=token="${ODOWNLOADER_TOKEN}" \
        --dry-run=client -o yaml | oc -n "$OC_NAMESPACE" apply -f -
    # WireGuard config for the oDownloader + qBittorrent VPN sidecars.
    - |
      if [ -n "${WIREGUARD_CONF:-}" ]; then
        oc -n "$OC_NAMESPACE" create secret generic wireguard-config \
          --from-literal=wg0.conf="${WIREGUARD_CONF}" \
          --dry-run=client -o yaml | oc -n "$OC_NAMESPACE" apply -f -
      else
        echo "WIREGUARD_CONF not set; expecting an existing wireguard-config secret"
        oc -n "$OC_NAMESPACE" get secret wireguard-config >/dev/null
      fi
    # --- Download plane: clients (ADR-019, one deployable unit) ---
    # SA + privileged/anyuid SCC for the WireGuard sidecars.
    - oc -n "$OC_NAMESPACE" apply -f k8s/clients/serviceaccount.yaml
    - oc -n "$OC_NAMESPACE" apply -f k8s/clients/scc-bindings.yaml
    - oc -n "$OC_NAMESPACE" apply -f k8s/clients/networkpolicy.yaml
    # The clients pull the oDownloader daemon image from the infrastructure
    # group and the linuxserver/jlesage images via the cache mirror, so the
    # gitlab-registry pull secret (created above) must be linked to the SA.
    - oc -n "$OC_NAMESPACE" secrets link download-clients gitlab-registry --for=pull
    - oc -n "$OC_NAMESPACE" apply -f k8s/clients/odownloader.yaml
    - oc -n "$OC_NAMESPACE" apply -f k8s/clients/qbittorrent.yaml
    - oc -n "$OC_NAMESPACE" apply -f k8s/clients/nzbget.yaml
    - oc -n "$OC_NAMESPACE" rollout status deployment/odownloader --timeout=10m
    # --- Gateway control plane ---
    - oc -n "$OC_NAMESPACE" apply -f k8s/service.yaml
    - oc -n "$OC_NAMESPACE" apply -f k8s/servicemonitor.yaml
    - oc -n "$OC_NAMESPACE" apply -f k8s/deployment.yaml
    - oc -n "$OC_NAMESPACE" set image deployment/download-gateway download-gateway="$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - oc -n "$OC_NAMESPACE" rollout status deployment/download-gateway --timeout=3m
    - oc logout
  environment:
    name: download-gateway-beta
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
