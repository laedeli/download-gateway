apiVersion: apps/v1
kind: Deployment
metadata:
  name: download-gateway
  namespace: stube
  labels:
    app: download-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: download-gateway
  template:
    metadata:
      labels:
        app: download-gateway
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: download-gateway
          image: registry.nalet.cloud/stube/download-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DOWNLOAD_GATEWAY_ADDR
              value: ":8080"
            - name: POLL_INTERVAL
              value: "5s"
            # Kafka producer (mTLS). KAFKA_TLS_* point at the cert mounted
            # from the stube-download-gateway KafkaUser secret. When unset
            # the gateway logs events instead of publishing (scaffold mode).
            - name: KAFKA_BROKERS
              value: "platform-kafka-kafka-bootstrap.platform-event-streaming.svc:9093"
            - name: KAFKA_TLS_CERT
              value: "/etc/kafka-cert/user.crt"
            - name: KAFKA_TLS_KEY
              value: "/etc/kafka-cert/user.key"
            - name: KAFKA_TLS_CA
              value: "/etc/kafka-cert/ca.crt"
            # oDownloader adapter — the daemon's direct static-token API
            # (port 8686), now in-stube after the ADR-019 migration. (The
            # old cross-namespace :80 went through the oauth2-proxy, which
            # the stube deployment drops.)
            - name: ODOWNLOADER_BASE_URL
              value: "http://odownloader.stube.svc.cluster.local:8686"
            - name: ODOWNLOADER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: odownloader-api
                  key: token
          volumeMounts:
            - name: kafka-cert
              mountPath: /etc/kafka-cert
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: kafka-cert
          secret:
            secretName: stube-download-gateway
            optional: true
