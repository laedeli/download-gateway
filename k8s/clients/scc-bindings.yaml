# SCC bindings for the download-clients ServiceAccount.
#
# The WireGuard egress sidecar (linuxserver/wireguard) on the oDownloader
# and qBittorrent pods needs the **privileged** SCC (/dev/net/tun + ip rule
# manipulation, NET_ADMIN + SYS_MODULE, /lib/modules + /dev/net/tun hostPath).
#
# IMPORTANT: the stube:deployer holds `anyuid` but NOT `privileged`, so it
# cannot create a RoleBinding granting privileged (RBAC escalation block —
# "attempting to grant RBAC permissions not currently held"). The privileged
# grant is therefore a ONE-TIME cluster-admin action, out of this pipeline:
#
#     oc adm policy add-scc-to-user privileged -z download-clients -n stube
#
# (mirrors how the deployer's own `anyuid` grant was set up out-of-band, and
# how infrastructure/oDownloader's pipeline — which runs with a privileged
# token — binds privileged to its SA). Until that grant exists, the
# oDownloader + qBittorrent pods (with the VPN sidecar) won't be admitted;
# NZBGet (no sidecar) and the gateway are unaffected.
#
# This file only carries the `anyuid` binding the deployer CAN grant
# (linuxserver/* images run as UID 1000 via PUID; anyuid stops OpenShift
# remapping them into stube's allocated UID range).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: download-clients-scc-anyuid
  namespace: stube
  labels:
    app.kubernetes.io/part-of: download-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: download-clients
    namespace: stube
