# qBittorrent (torrent client) — egresses through WireGuard (user
# requirement: "torrents ... go through wireguard"). Same VPN sidecar
# pattern as oDownloader; shares the wireguard-config Secret. WebUI (8090)
# stays reachable in-cluster for the gateway's qbittorrent adapter because
# the wg0.conf PostUp excepts the cluster CIDRs from the tunnel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: stube
  labels:
    app: qbittorrent
    app.kubernetes.io/part-of: download-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
        app.kubernetes.io/part-of: download-plane
    spec:
      serviceAccountName: download-clients
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wg-seed
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /config/wg_confs
              cp /tmp/wg/wg0.conf /config/wg_confs/wg0.conf
              chmod 600 /config/wg_confs/wg0.conf
              echo "[wg-seed] wg0.conf installed"
          volumeMounts:
            - name: wg-state
              mountPath: /config
            - name: wg-secret
              mountPath: /tmp/wg
              readOnly: true
      containers:
        - name: qbittorrent
          # docker.io, not lscr.io — the cluster image-signature policy rejects
          # lscr.io ("Source image rejected by policy"); docker.io is allowed.
          image: linuxserver/qbittorrent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Zurich
            - name: WEBUI_PORT
              value: "8090"
          ports:
            - name: web
              containerPort: 8090
              protocol: TCP
            - name: bt-tcp
              containerPort: 6881
              protocol: TCP
            - name: bt-udp
              containerPort: 6881
              protocol: UDP
          volumeMounts:
            - name: packages
              mountPath: /config
              subPath: _config/qbittorrent
            - name: packages
              mountPath: /downloads
              subPath: _downloads
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi

        - name: vpn
          image: ghcr.io/linuxserver/wireguard:latest
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Zurich
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          volumeMounts:
            - name: wg-state
              mountPath: /config
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: dev-net-tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

      volumes:
        - name: packages
          persistentVolumeClaim:
            claimName: packages
        - name: wg-state
          emptyDir: {}
        - name: wg-secret
          secret:
            secretName: wireguard-config
            items:
              - key: wg0.conf
                path: wg0.conf
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: ""
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: stube
  labels:
    app: qbittorrent
    app.kubernetes.io/part-of: download-plane
spec:
  selector:
    app: qbittorrent
  ports:
    # WebUI — the gateway's qbittorrent adapter drives this in-cluster.
    - name: web
      port: 8090
      targetPort: web
      protocol: TCP
