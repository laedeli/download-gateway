# Example secrets ONLY — the real ones are minted by the gateway pipeline
# from masked CI/CD variables (see ../../.gitlab-ci.yml). Never commit a
# real WireGuard private key or API token to git.
#
# 1) odownloader-api  — static bearer token the gateway adapter and the
#    katalog-manager-api bridge use to drive the daemon's direct API.
#    Minted from CI var ODOWNLOADER_TOKEN.
---
apiVersion: v1
kind: Secret
metadata:
  name: odownloader-api
  namespace: stube
  labels:
    app.kubernetes.io/part-of: download-plane
type: Opaque
stringData:
  token: "replace-me-with-a-strong-random-token"
---
# 2) wireguard-config — the wg0.conf the linuxserver/wireguard sidecars on
#    the oDownloader (JDownloader) and qBittorrent pods load. NZBGet does
#    NOT mount this — usenet egresses directly. Minted from CI var
#    WIREGUARD_CONF (the whole file, base64- or raw-pasted).
#
#    CRITICAL split-tunnel detail: the sidecar makes wg0 the default route,
#    which would also blackhole pod->Service and pod->pod traffic. The
#    PostUp rules below re-add the in-cluster CIDRs via the pod's original
#    gateway so the gateway can still reach the daemon API and Kafka. Keep
#    them. OKD here uses pod/Service CIDR 172.16.0.0/16 (adjust to your
#    cluster: classic OKD is 10.128.0.0/14 pods + 172.30.0.0/16 services).
apiVersion: v1
kind: Secret
metadata:
  name: wireguard-config
  namespace: stube
  labels:
    app.kubernetes.io/part-of: download-plane
type: Opaque
stringData:
  wg0.conf: |
    [Interface]
    PrivateKey = REPLACE_ME_PRIVATE_KEY
    Address = 10.2.0.2/32
    DNS = 10.2.0.1
    # Re-route in-cluster traffic around the tunnel so K8s networking keeps
    # working while all internet egress goes through the VPN.
    PostUp = DROUTE=$(ip route | awk '/default/ {print $3; exit}'); ip route add 172.16.0.0/16 via $DROUTE; ip route add 172.30.0.0/16 via $DROUTE
    PostDown = DROUTE=$(ip route | awk '/default/ {print $3; exit}'); ip route del 172.16.0.0/16 via $DROUTE; ip route del 172.30.0.0/16 via $DROUTE

    [Peer]
    PublicKey = REPLACE_ME_PEER_PUBLIC_KEY
    Endpoint = vpn.example.com:51820
    AllowedIPs = 0.0.0.0/0
    PersistentKeepalive = 25
