# ServiceAccount for the download clients (oDownloader + qBittorrent).
# The WireGuard egress sidecars need the privileged SCC (see
# scc-bindings.yaml), so the client pods run under this dedicated SA
# rather than stube's default SA — privileged stays scoped to the two
# pods that actually need a VPN sidecar, not the whole namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: download-clients
  namespace: stube
  labels:
    app.kubernetes.io/part-of: download-plane
    value-stream: stube
